<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forewarn first visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  /* The first visit, start to answer: landing, find your place, loading, then the answer in its
     three levels. Real data on every screen; Durban and Cape Town are replays of past forecasts. */
  :root {
    --bg: #e3e7e2; --paper: #f8f9f6; --ink: #16201b; --muted: #5d6a63; --line: #dde2dc;
    --water: #1d4ed8; --water-soft: #e3eafc;
    --green: #2f7d4f; --green-soft: #e3f1e7; --amber: #b86e00; --amber-soft: #fbefd9; --red: #b42318; --red-soft: #fbe3e0;
    --display: 'Bricolage Grotesque', system-ui, sans-serif; --text: 'Public Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--text); -webkit-font-smoothing: antialiased; }
  header { max-width: 1500px; margin: 0 auto; padding: 36px 16px 0; }
  h1 { font: 800 36px/1.05 var(--display); letter-spacing: -0.02em; margin: 0 0 8px; }
  header p { margin: 0; color: var(--muted); max-width: 70ch; }
  .row { max-width: 1500px; margin: 0 auto; padding: 24px 16px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 26px 22px; justify-items: center; align-items: start; }
  figure { margin: 0; width: 100%; max-width: 330px; }
  figcaption { padding: 12px 4px 0; }
  figcaption b { font: 600 18px/1.2 var(--display); display: block; }
  figcaption span { color: var(--muted); font-size: 14px; }
  .phone { position: relative; width: 100%; aspect-ratio: 360 / 760; background: var(--paper); border-radius: 26px; overflow: hidden; box-shadow: 0 16px 36px rgba(22,32,27,.13); display: flex; flex-direction: column; }
  .pad { padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
  .brand { font: 800 19px/1 var(--display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 7px; }
  .brand svg { width: 20px; height: 20px; color: var(--water); }
  .field { height: 50px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--muted); }
  .field.on { border-color: var(--ink); color: var(--ink); }
  .field svg { width: 18px; height: 18px; flex: none; }
  .caret { display: inline-block; width: 2px; height: 18px; background: var(--water); vertical-align: -3px; margin-left: 1px; }
  .btn { height: 50px; border-radius: 25px; border: 0; font: 600 15px/1 var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .btn svg { width: 18px; height: 18px; }
  .btn.dark { background: var(--ink); color: #fff; } .btn.light { background: var(--line); color: var(--ink); } .btn.red { background: var(--red); color: #fff; }
  .fine { font-size: 12px; color: var(--muted); margin: 0; }

  /* 1 landing */
  .hero { position: relative; height: 48%; background: center / cover no-repeat; }
  .hero::after { content: ''; position: absolute; inset: auto 0 0; height: 40%; background: linear-gradient(transparent, var(--paper)); }
  .hero .cap { position: absolute; left: 12px; top: 12px; font: 600 11px/1.2 var(--text); background: rgba(248,249,246,.92); padding: 5px 8px; border-radius: 7px; }
  .hero .pinlabel { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font: 600 12px/1 var(--text); background: var(--water); color: #fff; padding: 6px 8px; border-radius: 8px; }
  .h { font: 800 27px/1.08 var(--display); letter-spacing: -0.02em; margin: 0; }

  /* 2 find your place */
  .results { display: grid; border: 1px solid var(--line); border-radius: 14px; background: #fff; overflow: hidden; }
  .results div { padding: 11px 14px; border-top: 1px solid var(--line); display: grid; gap: 1px; }
  .results div:first-child { border-top: 0; background: var(--water-soft); }
  .results small { color: var(--muted); font-size: 12px; }
  .map { position: relative; flex: 1; border-radius: 16px; background: center / cover no-repeat; min-height: 160px; overflow: hidden; }
  .map .pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); display: grid; justify-items: center; }
  .map .pin i { font: 600 12px/1 var(--text); font-style: normal; background: var(--ink); color: #fff; padding: 6px 9px; border-radius: 8px; white-space: nowrap; }
  .map .pin::after { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--water); border: 3px solid #fff; margin-top: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .map .hint { position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: 12px; background: rgba(248,249,246,.92); padding: 7px 9px; border-radius: 9px; text-align: center; }

  /* 3 loading */
  .loadbg { position: absolute; inset: 0; background: center / cover no-repeat; filter: blur(6px) saturate(.7); transform: scale(1.08); opacity: .55; }
  .loadcard { position: relative; margin: auto 14px 14px; background: var(--paper); border-radius: 20px; padding: 18px; display: grid; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
  .step { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .step i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .step.done i { background: var(--green); color: #fff; } .step.now i { border: 2.5px solid var(--water); border-right-color: transparent; }
  .step.wait { color: var(--muted); } .step.wait i { border: 2px solid var(--line); }
  .step i svg { width: 13px; height: 13px; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; } .bar b { display: block; height: 100%; width: 46%; background: var(--ink); }

  /* 4 to 6 answers */
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top b { font-weight: 600; } .top small { display: block; color: var(--muted); font-size: 12px; }
  .chipdark { font-size: 11px; font-weight: 600; background: var(--ink); color: #fff; border-radius: 7px; padding: 4px 7px; }
  .thumb { height: 128px; border-radius: 16px; background: center 40% / cover no-repeat; position: relative; flex: none; }
  .thumb span { position: absolute; right: 8px; bottom: 8px; font: 600 12px/1 var(--text); background: rgba(248,249,246,.94); padding: 6px 9px; border-radius: 8px; }
  .nothumb { height: 64px; border-radius: 16px; border: 1.5px dashed var(--line); display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--muted); padding: 0 12px; flex: none; }
  .verdict { border-radius: 18px; padding: 14px; display: grid; gap: 8px; }
  .verdict.green { background: var(--green-soft); } .verdict.amber { background: var(--amber-soft); } .verdict.red { background: var(--red-soft); }
  .lvl { display: flex; align-items: center; gap: 7px; font: 800 24px/1 var(--display); letter-spacing: -0.02em; }
  .green .lvl { color: var(--green); } .amber .lvl { color: var(--amber); } .red .lvl { color: var(--red); }
  .lvl svg { width: 24px; height: 24px; flex: none; }
  .verdict p { margin: 0; font-size: 14px; }
  .drops { display: flex; flex-wrap: wrap; gap: 3px; } .drops svg { width: 8px; height: 10px; } .drops.few svg { width: 22px; height: 27px; }
  .drops .on { color: var(--water); } .drops .off { color: #b9c3c9; }
  .days { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; }
  .day { border-radius: 10px; padding: 6px 0 5px; display: grid; justify-items: center; gap: 1px; background: #fff; border: 1px solid var(--line); }
  .day svg { width: 18px; height: 18px; } .day b { font-size: 11px; font-weight: 600; } .day span { font-size: 9.5px; }
  .day.green span { color: var(--green); } .day.amber { background: var(--amber-soft); border-color: transparent; } .day.amber span { color: var(--amber); }
  .day.red { background: var(--red-soft); border-color: transparent; } .day.red span { color: var(--red); }
  .act { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .act i { width: 30px; height: 30px; border-radius: 9px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
  .act i svg { width: 17px; height: 17px; }
  h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
  .bottom { margin-top: auto; display: grid; gap: 8px; }
  .two { display: flex; gap: 8px; } .two .btn { height: 44px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Forewarn: the first visit</h1>
  <p>From opening the link to an answer for your own place. The answer comes in one of three levels; screens 5 and 6 are replays of what Forewarn would have said before real floods, from the real forecasts of that day.</p>
</header>
<main class="row" id="row"></main>

<script type="module">
const get = (n) => fetch(`data/${n}.json`).then((r) => r.json());
const [F, D, CT] = await Promise.all(['futures-eastleigh', 'timemachine-durban', 'timemachine-capetown'].map(get));
const svg = {
  logo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18c2 0 2-1.5 4.5-1.5S10 18 12 18s2-1.5 4.5-1.5S19 18 21 18"/><path d="M12 3v9M8.5 8.5L12 12l3.5-3.5"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  locate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  drop: '<svg viewBox="0 0 13 16"><path d="M6.5 1C4 5 1.5 7.6 1.5 10.3a5 5 0 0 0 10 0C11.5 7.6 9 5 6.5 1z" fill="currentColor"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.2"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/></svg>',
  rain: '<svg viewBox="0 0 24 24"><path d="M7 13h9.5a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.3 7.5 3 3 0 0 0 7 13z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 16l-1 2.5M13 16l-1 2.5M17 16l-1 2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  storm: '<svg viewBox="0 0 24 24"><path d="M7 12h9.5a3.5 3.5 0 0 0 .3-7A5 5 0 0 0 7.3 6.5 3 3 0 0 0 7 12z" fill="currentColor"/><path d="M8 15l-1.5 4M12 15l-1.5 4M16 15l-1.5 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  papers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M12 17V10M9 13l3-3 3 3"/></svg>',
  route: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h6a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h6"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',
  car: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16h14v-4l-2-5H7l-2 5z"/><circle cx="8" cy="16" r="1.5"/><circle cx="16" cy="16" r="1.5"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
};
const level = (p) => (p >= 0.5 ? 'red' : p >= 0.2 ? 'amber' : 'green'), word = { green: 'Unlikely', amber: 'Possible', red: 'Likely' };
function oneIn(k, n) {
  const p = k / n; let best = null;
  // the simplest fraction within 3 points of the share: 7 in 10, not 36 in 50
  for (const of of [2, 3, 4, 5, 10, 20, 50]) for (let a = 1; a < of; a++) { const e = Math.abs(a / of - p); if (e <= 0.03 && !best) best = { k: a, of, e }; }
  if (!best) for (const of of [10, 20, 50]) for (let a = 1; a < of; a++) { const e = Math.abs(a / of - p); if (!best || e < best.e - 1e-9) best = { k: a, of, e }; }
  return best;
}
const drops = (o) => `<div class="drops ${o.of <= 10 ? 'few' : ''}">${Array.from({ length: o.of }, (_, i) => `<span class="${i < o.k ? 'on' : 'off'}">${svg.drop}</span>`).join('')}</div>`;
const med = (a) => [...a].sort((x, y) => x - y)[Math.floor(a.length / 2)];
const icon = (m) => (m < 1 ? svg.sun : m < 10 ? svg.rain : svg.storm);
const wd = (d, o = { weekday: 'short' }) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { ...o, timeZone: 'UTC' });
const daysOf = (days, members, line, nameOf) => days.map((d, i) => { const v = members.map((m) => m[i]); const k = v.filter((x) => x >= line).length; return { d, k, lv: level(k / 51), m: med(v), name: nameOf(d, i) }; });
const strip = (cells) => `<div class="days" style="--n:${cells.length}">${cells.map((c) => `<div class="day ${c.lv}">${icon(c.m)}<b>${c.name}</b><span>${word[c.lv]}</span></div>`).join('')}</div>`;

// the three answers, from real forecasts
const E = daysOf(F.days, F.daily, F.trigger_mm, (d, i) => (i === 0 ? 'Today' : wd(d)));
const eW = E.reduce((a, b) => (b.k > a.k ? b : a)), eO = oneIn(eW.k, 51);
const DR = daysOf(D.days, D.runs['5d'].members_mm, 30, (d) => wd(d, { weekday: 'short', day: 'numeric' }));
const dW = DR.reduce((a, b) => (b.k > a.k ? b : a)), dO = oneIn(dW.k, 51);
const CR = daysOf(CT.days, CT.runs['4d'].members_mm, 30, (d) => wd(d, { weekday: 'short', day: 'numeric' }));
const cW = CR.reduce((a, b) => (b.k > a.k ? b : a)), cO = oneIn(cW.k, 51);

const screens = [
  { t: '1. Landing', n: 'One promise, one box. The picture is a real render of the March storm in Eastleigh. Location is offered, never required.', h: `
    <div class="hero" style="background-image:url(data/hero-march.jpg)"><span class="cap">Eastleigh, Nairobi. March 2026 storm</span></div>
    <div class="pad" style="margin-top:-30px;position:relative;z-index:1">
      <div class="brand">${svg.logo}Forewarn</div>
      <p class="h">Know what the weather will do to your place, before it happens.</p>
      <div class="field">${svg.search}Your street, farm or village</div>
      <button class="btn light">${svg.locate}Use my location</button>
      <p class="fine">Free. Covers Africa. Street-level 3D in Lagos and Nairobi.</p>
    </div>` },
  { t: '2. Find your place', n: 'Type a few letters, pick a result, then drag the pin to your door. The answer is for that exact spot, so the pin matters more than the name.', h: `
    <div class="pad">
      <div class="field on">${svg.search}Eastle<span class="caret"></span></div>
      <div class="results"><div><b>Eastleigh</b><small>Nairobi, Kenya</small></div><div><b>Eastleigh Section 1</b><small>Nairobi, Kenya</small></div><div><b>First Avenue Eastleigh</b><small>Street, Nairobi, Kenya</small></div></div>
      <div class="map" style="background-image:url(data/place-eastleigh.jpg)"><div class="pin"><i>Your place</i></div><div class="hint">Drag the map to put the pin on your door</div></div>
      <button class="btn dark">This is my place</button>
    </div>` },
  { t: '3. Loading', n: 'The agent says what it is doing. The answer arrives first, in about 3 seconds; the 3D streams in after it, so a slow phone is never left with a blank screen.', h: `
    <div class="loadbg" style="background-image:url(data/place-eastleigh.jpg)"></div>
    <div class="loadcard">
      <div class="step done"><i>${svg.tick}</i>Found your place: Eastleigh, Nairobi</div>
      <div class="step done"><i>${svg.tick}</i>Read 51 forecasts for the next 7 days</div>
      <div class="step now"><i></i>Checking the last flood here</div>
      <div class="step wait"><i></i>Building your place in 3D</div>
      <div class="bar"><b></b></div>
      <p class="fine">On a slow connection the 3D takes about 20 seconds. Your answer shows as soon as it is ready.</p>
    </div>` },
  { t: '4. Answer: unlikely', n: `Tonight's real forecast for Eastleigh. Green means nothing to do; the one long shot is shown, with its day, so nobody feels misled if it rains.`, h: `
    <div class="pad">
      <div class="top"><div><b>Eastleigh</b><small>Nairobi, next 7 days</small></div></div>
      <div class="thumb" style="background-image:url(data/hero-overview.jpg)"><span>See it in 3D</span></div>
      <div class="verdict green"><div class="lvl">${svg.ok}Unlikely to flood</div>
        <p>About ${eO.k} in ${eO.of} forecasts bring rain as heavy as the day it flooded here in March. That one is on ${wd(eW.d, { weekday: 'long' })}.</p>${drops(eO)}</div>
      ${strip(E)}
      <div class="act"><i>${svg.bell}</i>Follow this place. We tell you only if it gets worse.</div>
      <div class="bottom"><button class="btn dark">${svg.bell}Follow this place</button></div>
    </div>` },
  { t: '5. Answer: possible', n: 'Replay: Durban, 5 days before the 25 Feb 2025 flood. No street model there yet, so the screen says so and the line is heavy rain, 30 mm in a day.', h: `
    <div class="pad">
      <div class="top"><div><b>Durban</b><small>20 Feb 2025, 5 days before</small></div><span class="chipdark">Replay</span></div>
      <div class="nothumb">No street-level 3D here yet. Lagos and Nairobi first.</div>
      <div class="verdict amber"><div class="lvl">${svg.warn}Possible flood</div>
        <p>About ${dO.k} in ${dO.of} forecasts bring 30 mm or more on ${wd(dW.d, { weekday: 'long' })}. That can flood low streets.</p>${drops(dO)}</div>
      ${strip(DR)}
      <h3>Before ${wd(dW.d, { weekday: 'long' })}</h3>
      <div class="act"><i>${svg.papers}</i>Move papers and phones up high.</div>
      <div class="act"><i>${svg.bell}</i>Check again tomorrow. Forecasts change.</div>
      <div class="bottom"><div class="two"><button class="btn dark">${svg.bell}Follow</button><button class="btn light">${svg.share}Warn family</button></div></div>
    </div>` },
  { t: '6. Answer: likely', n: `Replay: Cape Town, 4 days before the 25 Jun 2025 flood. ${cW.k} of 51 forecasts went over 30 mm. Red leads with what to do, and warning family is the main button.`, h: `
    <div class="pad">
      <div class="top"><div><b>Cape Town</b><small>21 Jun 2025, 4 days before</small></div><span class="chipdark">Replay</span></div>
      <div class="verdict red"><div class="lvl">${svg.warn}Likely flood ${wd(cW.d, { weekday: 'long' })}</div>
        <p>About ${cO.k} in ${cO.of} forecasts bring 30 mm or more on ${wd(cW.d, { weekday: 'long' })}. Most say about ${Math.round(cW.m)} mm.</p>${drops(cO)}</div>
      ${strip(CR)}
      <h3>Do this by ${wd(cW.d, { weekday: 'long' })} morning</h3>
      <div class="act"><i>${svg.papers}</i>Move papers, phones and food up high.</div>
      <div class="act"><i>${svg.car}</i>Park on higher ground the night before.</div>
      <div class="act"><i>${svg.route}</i>Know your way out if the water rises.</div>
      <div class="bottom"><button class="btn red">${svg.share}Warn my family</button></div>
    </div>` },
];
document.getElementById('row').innerHTML = screens.map((s) => `<figure><div class="phone">${s.h}</div><figcaption><b>${s.t}</b><span>${s.n}</span></figcaption></figure>`).join('');
window.__ready = true;
</script>
</body>
</html>
